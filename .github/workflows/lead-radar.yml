name: Lead Radar

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lead-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run one sweep
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python radar.py --once

      - name: Save state (dedupe memory + leads history)
        run: |
          git config user.name "lead-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json state.json leads.csv
          git commit -m "radar update $(date -u +%FT%TZ)" || echo "nothing new"
          git push
